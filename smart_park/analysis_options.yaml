# Static analysis settings for SmartPark. `flutter analyze` (and CI) must
# report no issues. Rules: https://dart.dev/tools/linter-rules
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Async safety: a missing `await` on a Firestore write fails silently.
    # Wrap intentional fire-and-forget calls in `unawaited(...)`.
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    use_build_context_synchronously: true

    # Firestore data is `dynamic`; cast before indexing into nested maps.
    avoid_dynamic_calls: true

    prefer_final_locals: true
    always_declare_return_types: true
    avoid_print: true
